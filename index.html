<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Terminal</title>
    <!-- Use a local or trusted, obfuscated script to prevent extension blocking -->
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121214; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .box { background: #202024; padding: 30px; border-radius: 8px; width: 100%; max-width: 360px; box-sizing: border-box; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        h2 { margin: 0 0 10px 0; color: #00b37e; font-size: 20px; text-align: center; }
        p { color: #a8a8b3; font-size: 13px; line-height: 1.5; margin-bottom: 20px; text-align: center; }
        .input-group { margin-bottom: 15px; }
        input { width: 100%; padding: 12px; background: #121214; border: 1px solid #29292e; border-radius: 4px; color: #fff; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #00875f; border: none; border-radius: 4px; color: #fff; font-weight: bold; cursor: pointer; }
        button:hover { background: #00b37e; }
    </style>
</head>
<body>

    <div id="authPortal" class="box">
        <h2>Member Access</h2>
        <p>Authorize sync settings.</p>
        <div class="input-group">
            <input type="email" id="email" placeholder="Email" required>
        </div>
        <button onclick="secureSignIn()">Sign In</button>
    </div>

    <script>
        // DEFLECTION: Never put Supabase URL/Anon key here.
        // Direct calls are blocked by adblockers and exposed in network logs.
        async function secureSignIn() {
            const email = document.getElementById('email').value;
            
            // Send to a PROXY (like Vercel Function or NoCodeAPI)
            // This proxy handles the real Supabase key securely
            const response = await fetch('YOUR_SECURE_PROXY_ENDPOINT', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email })
            });
            
            const result = await response.json();
            if (result.success) {
                alert('Check your email for the magic link.');
            }
        }
    </script>
</body>
</html>
