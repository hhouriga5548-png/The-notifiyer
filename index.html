<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Interface</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121214; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .box { background: #202024; padding: 30px; border-radius: 8px; width: 100%; max-width: 360px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        h2 { margin: 0 0 10px 0; color: #00b37e; font-size: 20px; text-align: center; }
        p { color: #a8a8b3; font-size: 13px; line-height: 1.5; margin-bottom: 20px; text-align: center; }
        .input-group { margin-bottom: 15px; }
        input { width: 100%; padding: 12px; background: #121214; border: 1px solid #29292e; border-radius: 4px; color: #fff; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #00875f; border: none; border-radius: 4px; color: #fff; font-weight: bold; cursor: pointer; }
        button:hover { background: #00b37e; }
    </style>
</head>
<body>

    <div id="wrapper" class="box">
        <h2>System Access</h2>
        <p>Verify session token.</p>
        <div class="input-group">
            <!-- Renamed ID to avoid adblock triggers -->
            <input type="text" id="token" placeholder="Enter Code">
        </div>
        <button onclick="processToken()">Submit</button>
    </div>

    <script>
        // Use a generic name for the function
        async function processToken() {
            const tokenValue = document.getElementById('token').value;
            
            // SECURITY: Call your own serverless function (Vercel/Netlify), NOT Supabase directly.
            // This hides API keys, enables CORS, and defeats adblockers.
            const apiEndpoint = '/api/verify'; 

            try {
                const response = await fetch(apiEndpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: tokenValue })
                });
                
                const result = await response.json();
                if(result.success) {
                    alert('Success');
                }
            } catch (error) {
                console.error('Connection blocked or failed');
            }
        }
    </script>
</body>
</html>
